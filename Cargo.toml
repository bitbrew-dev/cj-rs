[package]
name = "cj-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "A small shell companion for jumping between useful directories"
license = "MIT"
repository = "https://github.com/bitbrew-dev/cj-rs"
keywords = ["cd", "cli", "directory", "git", "shell"]
categories = ["command-line-utilities"]
include = [
  "/src/**",
  "/tests/support/fake_tool.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE",
  "/README.md",
]

[[bin]]
name = "cj"
path = "src/main.rs"

[[bin]]
name = "cj-test-tool"
path = "tests/support/fake_tool.rs"
required-features = ["test-tools"]
test = false
bench = false

[features]
test-tools = []

[dependencies]
dunce = "1.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Foundation_Collections",
  "Storage",
  "Storage_Provider",
  "Win32_Storage_FileSystem",
  "Win32_System_WinRT",
  "Win32_System_WindowsProgramming",
] }
