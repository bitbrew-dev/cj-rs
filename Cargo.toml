[package]
name = "cj-rs"
version = "0.1.0"
edition = "2024"
description = "A small shell companion for jumping between useful directories"
license = "MIT"
repository = "https://github.com/bitbrew-dev/cj-rs"
keywords = ["cd", "cli", "directory", "git", "shell"]
categories = ["command-line-utilities"]

[[bin]]
name = "cj"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
