name: pull-request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - edited
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit checks
    uses: bitbrew-dev/r-workflows/.github/workflows/prek.yml@main
    # uses: bitbrew-dev/reusable-workflows/.github/workflows/prek.yml@main
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      prek_skip: fmt,check,clippy,test

  check-change-files:
    name: check-changed-files
    outputs:
      tests: ${{ steps.check-changes.outputs.tests_any_modified }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: get rust modules that have changed
        id: check-changes
        uses: tj-actions/changed-files@2f7c5bfce28377bc069a65ba478de0a74aa0ca32 # v46.0.1
        with:
          files_yaml: |
            tests:
              - src/**/rs
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml

  rust-ci:
    name: rust ci
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: check formatting
        run: cargo fmt --all -- --check
      - name: run cargo check
        run: cargo check --verbose
      - name: run clippy
        run: cargo clippy --verbose -- -D warnings
      - name: build binary
        run: cargo build --verbose
      - name: run test
        run: cargo test --verbose
    env:
      CARGO_TERM_COLOR: always

  pr-labeler:
    name: pr labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: pr labeler
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
