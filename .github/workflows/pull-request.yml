name: pull-request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - edited
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit checks
    uses: bitbrew-dev/r-workflows/.github/workflows/prek.yml@main
    # uses: bitbrew-dev/reusable-workflows/.github/workflows/prek.yml@main
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      prek_skip: fmt,check,clippy,test

  check-change-files:
    name: check-changed-files
    outputs:
      tests: ${{ steps.check-changes.outputs.tests_any_modified }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: get rust modules that have changed
        id: check-changes
        uses: tj-actions/changed-files@2f7c5bfce28377bc069a65ba478de0a74aa0ca32 # v46.0.1
        with:
          files_yaml: |
            tests:
              - src/**/*.rs
              - tests/**/*.rs
              - tests/**/*.py
              - .github/workflows/*.yml
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml

  rust-ci:
    name: rust ci
    runs-on: ubuntu-latest
    needs: check-change-files
    if: needs.check-change-files.outputs.tests == 'true'
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: install minimum supported Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
      - name: install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
          nu_version=0.115.1
          nu_target=x86_64-unknown-linux-gnu
          nu_archive="nu-${nu_version}-${nu_target}.tar.gz"
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/${nu_archive}" \
            "https://github.com/nushell/nushell/releases/download/${nu_version}/${nu_archive}"
          printf '%s  %s\n' \
            d11d825241f6504a3617c535fa725a9dd6d009c86d7b19fb3168b47635b9d8b0 \
            "${RUNNER_TEMP}/${nu_archive}" | sha256sum --check --strict
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/${nu_archive}" \
            --directory "${RUNNER_TEMP}"
          sudo install --mode 0755 \
            "${RUNNER_TEMP}/nu-${nu_version}-${nu_target}/nu" \
            /usr/local/bin/nu
          zsh --version
          nu --version
          pwsh --version
      - name: check formatting
        run: cargo fmt --all -- --check
      - name: run cargo check
        run: cargo check --verbose
      - name: run clippy
        run: cargo clippy --verbose -- -D warnings
      - name: build binary
        run: cargo build --verbose
      - name: run test
        run: cargo test --verbose
    env:
      CARGO_TERM_COLOR: always
      CJ_REQUIRE_SHELLS: "1"

  windows-ci:
    name: windows ci
    runs-on: windows-latest
    needs: check-change-files
    if: ${{ needs.check-change-files.outputs.tests == 'true' }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: install minimum supported Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          pwsh --version
      - name: check formatting
        run: cargo fmt --all -- --check
      - name: run cargo check
        run: cargo check --verbose --all-targets --all-features
      - name: run clippy
        run: cargo clippy --verbose --all-targets --all-features -- -D warnings
      - name: build binary
        run: cargo build --verbose --all-features
      - name: run tests
        run: cargo test --verbose --all-targets --all-features
    env:
      CARGO_TERM_COLOR: always
      CJ_REQUIRE_POWERSHELL: "1"

  pr-labeler:
    name: pr labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: pr labeler
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
