name: semantic-release

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "If you are sure to launch a new release, put the value to true."
        default: "false"
        required: true
        type: choice
        options:
          - "true"
          - "false"

jobs:
  semantic-release:
    name: semantic-release
    if: ${{ inputs.prompt == 'true' }}
    uses: bitbrew-dev/r-workflows/.github/workflows/semantic-release.yml@main
    # uses: bitbrew-dev/reusable-workflows/.github/workflows/semantic-release.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: read
      packages: read
    secrets: inherit
    with:
      new_version_title: "🦘 Jump!"

  build-binaries:
    name: build & attach ${{ matrix.target }}
    needs: semantic-release
    if: ${{ needs.semantic-release.outputs.new_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: checkout the released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_tag }}

      - name: install pinned Rust toolchain and target
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustc --version

      - name: build binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: package tarball + checksum
        if: ${{ runner.os != 'Windows' }}
        run: |
          set -euo pipefail
          tag="${{ needs.semantic-release.outputs.new_release_tag }}"
          target="${{ matrix.target }}"
          dist="cj-rs-${tag}-${target}"
          tar -C "target/${target}/release" -czf "${dist}.tar.gz" cj
          shasum -a 256 "${dist}.tar.gz" > "${dist}.tar.gz.sha256"

      - name: upload Unix artifacts to release
        if: ${{ runner.os != 'Windows' }}
        run: |
          gh release upload "${{ needs.semantic-release.outputs.new_release_tag }}" \
            cj-rs-*.tar.gz cj-rs-*.tar.gz.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: smoke-test, package, and upload Windows artifacts
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $tag = '${{ needs.semantic-release.outputs.new_release_tag }}'
          $target = '${{ matrix.target }}'
          $binary = "target/$target/release/cj.exe"
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'cj --version failed' }
          $archive = "cj-rs-$tag-$target.zip"
          Compress-Archive -LiteralPath $binary -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
          gh release upload $tag $archive "$archive.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ github.token }}

  publish-crate:
    name: publish cj-rs to crates.io
    needs:
      - semantic-release
      - build-binaries
    if: ${{ needs.semantic-release.outputs.new_release == 'true' && needs.build-binaries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # id-token: write
    steps:
      - name: checkout the released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_tag }}
      - name: install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p cj-rs --locked
